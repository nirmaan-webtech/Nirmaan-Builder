name: Build Nirmaan Suite release

on:
  push:
    branches:
      - development
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    if: ${{ github.ref == 'refs/heads/development' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
    name: Build one-upload Nirmaan Suite ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React editor
        working-directory: packages/plugin/nirmaan-builder
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble unified theme package
        run: |
          rm -rf dist
          mkdir -p dist/package/nirmaan-starter/bundled-plugins
          cp -a packages/theme/nirmaan-starter/. dist/package/nirmaan-starter/
          cp -a packages/plugin/nirmaan-builder dist/package/nirmaan-starter/bundled-plugins/
          cd dist/package
          zip -r ../nirmaan-suite.zip nirmaan-starter \
            -x 'nirmaan-starter/bundled-plugins/nirmaan-builder/node_modules/*' \
               'nirmaan-starter/bundled-plugins/nirmaan-builder/.git/*'

      - name: Upload unified ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirmaan-suite-${{ github.ref_name }}
          path: dist/nirmaan-suite.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nirmaan-suite.zip
          generate_release_notes: true
          draft: false
          prerelease: false
