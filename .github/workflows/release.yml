name: Build stable WordPress packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build and publish installable ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React editor
        working-directory: packages/plugin/nirmaan-builder
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package theme and plugin
        run: |
          mkdir -p dist
          cd packages/theme
          zip -r ../../dist/nirmaan-starter-theme.zip nirmaan-starter
          cd ../plugin
          zip -r ../../dist/nirmaan-builder-plugin.zip nirmaan-builder -x 'nirmaan-builder/node_modules/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nirmaan-starter-theme.zip
            dist/nirmaan-builder-plugin.zip
          generate_release_notes: true
          draft: false
          prerelease: false
