name: Nirmaan theme quality checks

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint theme PHP
        run: find nirmaan-builder -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run document validator tests
        run: php tests/unit/test-document-validator.php

  builder-build:
    name: Build integrated React editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nirmaan-builder/builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install editor dependencies
        run: npm install --no-audit --no-fund
      - name: Build editor assets
        run: npm run build
      - name: Commit compiled editor assets to development
        if: github.ref == 'refs/heads/development'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/build/
          if ! git diff --cached --quiet; then
            git commit -m 'Build integrated visual editor assets [skip ci]'
            git push
          fi

      - name: Upload editor assets
        uses: actions/upload-artifact@v4
        with:
          name: nirmaan-builder-theme-assets
          path: nirmaan-builder/builder/assets/build/

  theme-structure:
    name: Single theme structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify integrated theme
        run: |
          test -f nirmaan-builder/style.css
          test -f nirmaan-builder/functions.php
          test -f nirmaan-builder/builder/bootstrap.php
          test -f nirmaan-builder/builder/includes/class-document-validator.php
          test -f nirmaan-builder/builder/includes/rest/class-documents-controller.php
          test -f nirmaan-builder/builder/src/editor.jsx
          test -f nirmaan-builder/builder/package.json
          test ! -d packages/plugin
          test ! -d packages/theme
          grep -q "Theme Name: Nirmaan Builder" nirmaan-builder/style.css
          grep -q "builder/bootstrap.php" nirmaan-builder/functions.php
