name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find . -path './vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l

  javascript:
    name: JavaScript syntax and feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: npm run build
      - name: Run feature smoke tests
        run: npm test

  theme-package:
    name: Build installable theme ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package WordPress theme
        run: git archive --format=zip --prefix=nirmaan-builder/ HEAD -o nirmaan-builder-updated.zip
      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nirmaan-builder-updated-theme
          path: nirmaan-builder-updated.zip
          if-no-files-found: error
          retention-days: 14
